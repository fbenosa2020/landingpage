<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Data Form</title>
    <link rel="stylesheet" href="./style/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-nav">
                <a href="index.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i>
                    Back to Home
                </a>
            </div>
            <h1>Personal Bio Data</h1>
            <p>Please fill in your information below</p>
        </header>
        
        <form id="bioForm" class="bio-form">
            <!-- Profile Picture Section -->
            <div class="profile-section">
                <div class="profile-picture-container">
                    <img id="profileImg" src="./image/placeholder-avatar.jpg" alt="Profile Picture" class="profile-picture">
                    <div class="upload-overlay">
                        <input type="file" id="profileUpload" accept="image/*" class="file-input">
                        <label for="profileUpload" class="upload-btn">
                            <span>📷</span>
                            Upload Photo
                        </label>
                    </div>
                </div>
            </div>

            <!-- Personal Information -->
            <div class="form-section">
                <h2>Personal Information</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name *</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name *</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="dateOfBirth">Date of Birth *</label>
                        <input type="date" id="dateOfBirth" name="dateOfBirth" required>
                    </div>
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender">
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="nationality">Nationality</label>
                        <input type="text" id="nationality" name="nationality">
                    </div>
                    <div class="form-group">
                        <label for="maritalStatus">Marital Status</label>
                        <select id="maritalStatus" name="maritalStatus">
                            <option value="">Select Status</option>
                            <option value="single">Single</option>
                            <option value="married">Married</option>
                            <option value="divorced">Divorced</option>
                            <option value="widowed">Widowed</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Contact Information -->
            <div class="form-section">
                <h2>Contact Information</h2>
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label for="alternatePhone">Alternate Phone</label>
                        <input type="tel" id="alternatePhone" name="alternatePhone">
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Address *</label>
                    <textarea id="address" name="address" rows="3" required></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City *</label>
                        <input type="text" id="city" name="city" required>
                    </div>
                    <div class="form-group">
                        <label for="zipCode">ZIP Code</label>
                        <input type="text" id="zipCode" name="zipCode">
                    </div>
                </div>
            </div>

            <!-- Educational Background -->
            <div class="form-section">
                <h2>Educational Background</h2>
                <div class="form-group">
                    <label for="highestEducation">Highest Education Level</label>
                    <select id="highestEducation" name="highestEducation">
                        <option value="">Select Education Level</option>
                        <option value="high-school">High School</option>
                        <option value="bachelor">Bachelor's Degree</option>
                        <option value="master">Master's Degree</option>
                        <option value="phd">PhD</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="institution">Institution/University</label>
                    <input type="text" id="institution" name="institution">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="fieldOfStudy">Field of Study</label>
                        <input type="text" id="fieldOfStudy" name="fieldOfStudy">
                    </div>
                    <div class="form-group">
                        <label for="graduationYear">Graduation Year</label>
                        <input type="number" id="graduationYear" name="graduationYear" min="1950" max="2030">
                    </div>
                </div>
            </div>

            <!-- Professional Information -->
            <div class="form-section">
                <h2>Professional Information</h2>
                <div class="form-group">
                    <label for="currentJob">Current Job Title</label>
                    <input type="text" id="currentJob" name="currentJob">
                </div>
                
                <div class="form-group">
                    <label for="company">Company/Organization</label>
                    <input type="text" id="company" name="company">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="experience">Years of Experience</label>
                        <input type="number" id="experience" name="experience" min="0">
                    </div>
                    <div class="form-group">
                        <label for="salary">Expected/Current Salary</label>
                        <input type="text" id="salary" name="salary">
                    </div>
                </div>

                <div class="form-group">
                    <label for="skills">Skills (comma separated)</label>
                    <textarea id="skills" name="skills" rows="3" placeholder="e.g., JavaScript, Project Management, Communication"></textarea>
                </div>
            </div>

            <!-- Additional Information -->
            <div class="form-section">
                <h2>Additional Information</h2>
                <div class="form-group">
                    <label for="languages">Languages Known</label>
                    <input type="text" id="languages" name="languages" placeholder="e.g., English, Spanish, French">
                </div>
                
                <div class="form-group">
                    <label for="hobbies">Hobbies & Interests</label>
                    <textarea id="hobbies" name="hobbies" rows="2"></textarea>
                </div>

                <div class="form-group">
                    <label for="additionalInfo">Additional Information</label>
                    <textarea id="additionalInfo" name="additionalInfo" rows="3"></textarea>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="form-actions">
                <button type="button" id="previewBtn" class="btn btn-secondary">Preview Bio Data</button>
                <button type="button" id="downloadBtn" class="btn btn-primary">Download PDF</button>
                <button type="submit" class="btn btn-success">Save Information</button>
            </div>
        </form>

        <!-- Preview Modal -->
        <div id="previewModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="previewContent"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
